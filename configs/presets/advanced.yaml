difficulty: advanced

# See configs/presets/beginner.yaml for the convention this file follows.

structure:
  classes:
    min: 5
    max: 8

oop:
  inheritance:
    enabled: true
    max_depth: 3
  abstraction:
    enabled: true
  interface:
    enabled: true
  composition:
    enabled: true
  aggregation:
    # Was `false`, which made aggregation the only feature in the progression to go true at
    # intermediate and back to false at advanced, and contradicted all five shipped domains -
    # every one of them lists an aggregation hint, so every advanced run was guaranteed to fire
    # 2.7_aggregation_fallback and retype those edges. Reproducible lossiness inside the
    # declared supported matrix, not bad luck. See README's found-live item #6.
    enabled: true
