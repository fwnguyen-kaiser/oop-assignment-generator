name: RPG Game System
description: |
  A role-playing game system with characters, weapons, magic spells, and enemies.
# See configs/domains/animal.yaml for the convention this file follows.
keywords:
  - Character
  - Weapon
  - Spell
  - Enemy
entity_hints:
  core:
    - Character
    - Weapon
    - Enemy
  optional:
    - Spell
    - Armor
    - Warrior
    - Mage
    - DamageDealer    # interface candidate: shared behaviour (deals damage)
relationship_hints:
  inheritance:
    - Character -> Warrior
    - Character -> Mage
  composition:
    - Character -> Weapon    # an equipped weapon instance belongs to that character
    - Character -> Armor
  aggregation:
    - Character -> Enemy     # a character can face several enemies over a session
    - Mage -> Spell          # a spell is shared game data a mage knows, not a part it owns
  implements:
    - Warrior -> DamageDealer
    - Mage -> DamageDealer
style: fantasy
