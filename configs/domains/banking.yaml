name: Banking System
description: |
  A banking application that manages customer accounts and financial transactions.
# See configs/domains/animal.yaml for the convention this file follows.
keywords:
  - Account
  - Customer
  - Transaction
  - Bank
entity_hints:
  core:
    - Account
    - Customer
  optional:
    - CheckingAccount
    - SavingsAccount
    - Bank
    - InterestBearing   # interface candidate: shared behaviour (accrues interest)
    - Auditable         # interface candidate: shared behaviour (logs every change)
relationship_hints:
  inheritance:
    - Account -> CheckingAccount
    - Account -> SavingsAccount
  composition:
    - Bank -> Account      # an account cannot exist without the bank that issued it
  aggregation:
    - Bank -> Customer     # customers are people, not lifecycle-owned parts of the bank
  implements:
    - SavingsAccount -> InterestBearing
    - CheckingAccount -> Auditable
style: realistic
