name: Library Management System
description: |
  A system to manage books, library members, and borrowing transactions.
keywords:
  - Book
  - Member
  - Loan
  - Librarian
entity_hints:
  core:
    - Book
    - Member
    - Loan
  optional:
    - Librarian
    - Library
    - ReferenceBook
    - FictionBook
    - Borrowable      # interface candidate
relationship_hints:
  inheritance:
    - Book -> ReferenceBook
    - Book -> FictionBook
  composition:
    - Library -> Book
  aggregation:
    - Library -> Member      # members are people, not lifecycle-owned parts of the library
    - Member -> Loan         # a member can have several loans at once/over time
  association:
    - Loan -> Book           # one loan record references exactly one book
  implements:
    - FictionBook -> Borrowable
style: realistic
