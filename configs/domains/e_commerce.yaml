name: E-Commerce Platform
description: |
  A platform for online shopping, managing products, shopping carts, and customer orders.
# See configs/domains/animal.yaml for the convention this file follows.
keywords:
  - Product
  - Cart
  - Order
  - Payment
entity_hints:
  core:
    - Product
    - Order
    - Customer
  optional:
    - ShoppingCart
    - Payment
    - PhysicalProduct
    - DigitalProduct
    - Taxable        # interface candidate: shared behaviour (tax is calculated on it)
relationship_hints:
  inheritance:
    - Product -> PhysicalProduct
    - Product -> DigitalProduct
  composition:
    - Customer -> ShoppingCart   # the cart belongs to exactly one customer and dies with them
  aggregation:
    - Order -> Product      # products live in the catalog independently of any one order
  association:
    - Order -> Payment
  implements:
    # Was `Product -> Taxable`, i.e. the abstract base. That made every product taxable
    # including digital ones, which defeats the point of isolating tax as its own contract -
    # and a live run's LLM overrode the hint to this pair anyway.
    - PhysicalProduct -> Taxable
style: modern
