# Central Knowledge Base for OOP Concepts (RAG Injector)
# Only concepts that are enabled in the preset will be injected into the LLM prompt.

inheritance:
  definition:
    - "Represents an is-a relationship between classes, establishing a hierarchy."
  rules:
    - "Not a relationship: inheritance is declared on the entity itself via its `extends` field (a single superclass name, or null), never via a 'relationships' entry."
    - "Depth: the inheritance depth defines the maximum number of consecutive `extends` links from a leaf subclass to the root base class."
  examples:
    - "Depth 2: Car sets extends='Vehicle'"
    - "Depth 3: CheckingAccount sets extends='BankAccount', which itself sets extends='Account'"

abstraction:
  definition:
    - "Represents the concept of hiding complex implementation details behind an interface or abstract class."
  rules:
    - "Abstract Class: Set 'is_abstract: true' on any domain entity that serves as a base class and should not be instantiated directly."
  examples:
    - "Shape (is_abstract: true) -> Circle (concrete)"

interface:
  definition:
    - "Defines a contract of behavior that implementing classes must fulfill."
  rules:
    - "Interface Class: Set 'is_interface: true' on any entity that acts purely as a contract."
    - "A class fulfilling an interface uses the 'implements' relationship (source=ImplementingClass, target=Interface). An interface extending another interface instead uses its OWN `extends_interfaces` field (a list, since Java allows extending multiple interfaces) - never a relationship."
  examples:
    - "PaymentGateway (is_interface: true)"

composition:
  definition:
    - "Represents a strict whole-part relationship where the child cannot exist independently of the parent."
  rules:
    - "Directionality: The 'source' MUST be the Owner (Whole), and the 'target' MUST be the Owned (Part)."
  examples:
    - "House (source) -> Room (target)"

aggregation:
  definition:
    - "Represents a loose whole-part relationship where the child can exist independently of the parent."
  rules:
    - "Directionality: The 'source' MUST be the Owner (Whole), and the 'target' MUST be the Owned (Part)."
  examples:
    - "Department (source) -> Teacher (target)"
